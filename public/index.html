<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BodyFactory">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c0f">
  <!--SEO-->
  <link rel="icon" type="image/webp" href="/img/logo-96.webp">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/styles.css?v=__BUILD__">
  <link rel="modulepreload" href="/js/app.js?v=__BUILD__">
  <link rel="modulepreload" href="/js/ui.js?v=__BUILD__">
  <!--BOOT-->
  <script type="module" src="/js/app.js?v=__BUILD__"></script>
</head>
<body data-page="<!--PAGE-->">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/" aria-label="BodyFactory Gym, inicio">
        <img class="brand-logo" src="/img/logo-96.webp" srcset="/img/logo-96.webp 96w, /img/logo-192.webp 192w" sizes="52px" width="52" height="46" alt="BodyFactory Gym">
        <span class="brand-name">BodyFactory<small>Gym · Suplementos</small></span>
      </a>
      <form class="search" id="searchForm" role="search" action="/" method="get">
        <label class="sr" for="q">Buscar productos</label>
        <span class="search-ic" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg></span>
        <input id="q" name="q" type="search" placeholder="Buscar proteína, creatina, sabor…" autocomplete="off" enterkeyhint="search">
      </form>
      <div class="switch" role="group" aria-label="Tipo de precio">
        <button type="button" data-action="mode" data-mode="retail" aria-pressed="true">Normal</button>
        <button type="button" data-action="mode" data-mode="wholesale" aria-pressed="false">Mayorista</button>
      </div>
      <button type="button" class="icon-btn search-toggle" data-action="toggle-search" aria-controls="searchForm" aria-expanded="false" aria-label="Buscar">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></svg>
      </button>
      <button type="button" class="btn cart-btn" data-action="open-cart" aria-label="Abrir carrito (0)">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button type="button" class="icon-btn menu-btn" data-action="open-menu" aria-controls="menuDrawer" aria-expanded="false" aria-label="Abrir menú">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main id="contenido">
<!--MAIN-->
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <nav aria-label="Categorías" class="foot-nav"><!--FOOTNAV--></nav>
      <p><strong>Aviso:</strong> <span id="disclaimerFoot"><!--DISCLAIMER--></span></p>
      <p class="muted">© <span id="year"><!--YEAR--></span> BodyFactory Gym · Managua, Nicaragua</p>
    </div>
  </footer>

  <dialog id="menuDrawer" class="drawer" aria-label="Menú">
    <div class="drawer-head">
      <span class="drawer-title">Menú</span>
      <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Cerrar menú">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <section class="drawer-sec">
        <h2 class="drawer-h">Tipo de precio</h2>
        <div class="switch switch-block" role="group" aria-label="Tipo de precio">
          <button type="button" data-action="mode" data-mode="retail" aria-pressed="true">Normal</button>
          <button type="button" data-action="mode" data-mode="wholesale" aria-pressed="false">Mayorista</button>
        </div>
      </section>
      <nav class="drawer-sec" aria-label="Categorías del catálogo">
        <h2 class="drawer-h">Categorías</h2>
        <div class="drawer-cats" id="drawerCats"><!--DRAWERCATS--></div>
      </nav>
      <section class="drawer-sec">
        <h2 class="drawer-h"><label for="sortDrawer">Ordenar</label></h2>
        <select id="sortDrawer" class="field" data-sort>
          <option value="pop">Más vendidos</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
        </select>
      </section>
      <nav class="drawer-sec drawer-links" aria-label="Secciones">
        <h2 class="drawer-h">Explorar</h2>
        <a href="/#comparador" data-action="drawer-link">Comparador por porción</a>
        <a href="/#resenas" data-action="drawer-link">Reseñas</a>
        <a href="/#nosotros" data-action="drawer-link">Ubicación y horario</a>
        <a href="/#galeria" data-action="drawer-link">Nuestro gimnasio</a>
        <a href="/#faq" data-action="drawer-link">Preguntas frecuentes</a>
      </nav>
      <a class="btn wa block" id="drawerWa" href="https://wa.me/50576816733" target="_blank" rel="noopener noreferrer">Escríbenos por WhatsApp</a>
    </div>
  </dialog>
  <dialog id="productDialog" class="sheet" aria-label="Ficha del producto"></dialog>
  <dialog id="cartDialog" class="sheet side" aria-label="Carrito"></dialog>
  <dialog id="lightbox" class="sheet lightbox" aria-label="Foto ampliada"></dialog>
  <dialog id="reviewDialog" class="sheet" aria-label="Escribir una reseña"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
